{% extends 'layouts/base.html' %}
{% load static %}

{% block breadcrumbs %}{% endblock breadcrumbs %}

{% block content %}
  <h5 class="an-page-title an-page-header__title">Consumo mensual de combustible por móvil</h5>
  <div class="an-filter-bar">
  <div class="form-group row">
    <select id="empresa-select" name="empresa" class="form-control an-field col-mb-12 col-6">
      {% for empresa in empresas %}
        <option value="{{ empresa.id }}">{{ empresa.nombre }}</option>
      {% endfor %}
    </select>
    <input type="date" id="fecha-inicio" name="fecha_inicio" value="{{ fecha_inicio }}" class="form-control an-field col-mb-12 col-3">
    <input type="date" id="fecha-fin" name="fecha_fin" value="{{ fecha_fin }}" class="form-control an-field col-mb-12 col-3">
  </div>
  <div class="row">
    <button id="generar-datos" onclick="generarDatos()" class="btn btn-primary col-mb-12 col-12">Generar Datos</button>
  </div>
  </div>
  <div class="container">
    <canvas id="myChartConsumoCombustiblePorMes" ></canvas>
  </div>
{% endblock %}

{% block extra_js %}
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script>
    $(document).ready(function() {
      $('#empresa-select').on("change", function() {
        generarDatos();
      });
    });
  </script>
  <script>
    const paletaMoviles = [
      { fondo: 'rgba(59, 93, 48, 0.16)', linea: '#3b5d30' },
      { fondo: 'rgba(85, 107, 47, 0.16)', linea: '#556b2f' },
      { fondo: 'rgba(120, 155, 97, 0.16)', linea: '#789b61' },
      { fondo: 'rgba(49, 94, 112, 0.16)', linea: '#315e70' },
      { fondo: 'rgba(40, 112, 68, 0.16)', linea: '#287044' },
      { fondo: 'rgba(128, 91, 18, 0.16)', linea: '#805b12' }
    ];

    function colorParaMovil(nombre) {
      var clave = String(nombre);
      var hash = 0;
      for (var i = 0; i < clave.length; i++) {
        hash = (hash * 31 + clave.charCodeAt(i)) >>> 0;
      }
      return paletaMoviles[hash % paletaMoviles.length];
    }

    function generarDatos() {
      if (window.chart) {
        window.chart.destroy();
      }
      var empresaId = $('#empresa-select').val();
      var fecha_inicio = $('#fecha-inicio').val();
      var fecha_fin = $('#fecha-fin').val();
      $.ajax({
        type: 'GET',
        url: '{% url "moviles:datos_consumo_combustible" %}',
        data: {empresa: empresaId, fecha_inicio: fecha_inicio, fecha_fin: fecha_fin},
        success: function(data) {
          var ctx = document.getElementById('myChartConsumoCombustiblePorMes').getContext('2d');
          window.chart = new Chart(ctx, {
            type: 'line',
            data: {
              labels: [...new Set(data.map(dato => dato.mes))],
              datasets: data.reduce((acc, dato) => {
                var movil = dato.movil;
                if (!acc[movil]) {
                  var color = colorParaMovil(movil);
                  acc[movil] = {
                    label: movil,
                    data: data.filter(d => d.movil === movil).map(d => d.consumo),
                    backgroundColor: color.fondo,
                    borderColor: color.linea,
                    borderWidth: 1
                  };
                }
                return acc;
              }, {}),
              datasets: Object.values(data.reduce((acc, dato) => {
                var movil = dato.movil;
                if (!acc[movil]) {
                  var color = colorParaMovil(movil);
                  acc[movil] = {
                    label: movil,
                    data: data.filter(d => d.movil === movil).map(d => d.consumo),
                    backgroundColor: color.fondo,
                    borderColor: color.linea,
                    borderWidth: 1
                  };
                }
                return acc;
              }, {}))
            },
            options: {
              scales: {
                y: {
                  beginAtZero: true
                }
              }
            }
          });
        }
      });
    }  
  </script>
{% endblock %}
