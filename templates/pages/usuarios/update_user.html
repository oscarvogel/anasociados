{% extends 'layouts/base.html' %}
{% load static %}

{% block breadcrumbs %}{% endblock breadcrumbs %}

{% block content %}
<section class="an-profile-page">
    <h1 class="an-page-title an-page-header__title">Mi perfil</h1>
    <div class="card an-card">
        <div class="card-body an-card-body">
            <p class="text-muted">Actualizá tus datos de acceso y perfil.</p>
            <form id="update-profile-form" method="POST">
                {% csrf_token %}
                {{ form.as_p }}
                <button type="submit" class="btn btn-primary">Guardar cambios</button>
            </form>
        </div>
    </div>
</section>
{% endblock content %}
