{% extends 'layouts/base.html' %}
{% load static %}

{% block breadcrumbs %}{% endblock breadcrumbs %}

{% block content %}
<div class="container mt-4">
    <h5 class="an-page-title an-page-header__title">Resumen mensual</h5>

    <div class="card an-card">
        <div class="card-header an-card-header"><h5>Seleccionar cliente</h5></div>
        <div class="card-body an-card-body">
            <div class="row">
                <div class="col-md-4 mb-3">
                    <label for="cliente-select">Cliente</label>
                    <select id="cliente-select" class="form-control an-field">
                        <option value="">--Selecciona un cliente--</option>
                        {% for cliente in clientes %}
                        <option value="{{ cliente.id }}" {% if cliente.id == cliente_id_selected %}selected{% endif %}>
                            {{ cliente.nombre }}
                        </option>
                        {% endfor %}
                    </select>
                </div>
            </div>
            <div class="row">
                <div class="col-12">
                    <button type="button" id="resumen-button" class="btn btn-secondary">Generar</button>
                </div>
            </div>

            <div class="mt-3" id="task-progress" style="display:none;">
                <div class="progress">
                    <div id="progress-bar" class="progress-bar" role="progressbar"
                         aria-valuenow="0" aria-valuemin="0" aria-valuemax="100" style="width:0%;"></div>
                </div>
                <p id="estado-tarea" class="text-muted mt-2 mb-0" role="status" aria-live="polite"></p>
            </div>
        </div>
    </div>

    <div class="card an-card mt-3" id="descarga-archivos" style="display:none;">
        <div class="card-header an-card-header"><h5>Descargar resumen</h5></div>
        <div class="card-body an-card-body">
            <a class="btn btn-primary" href="#" id="download-link" download>Descargar resumen mensual (PDF)</a>
        </div>
    </div>
</div>
{% endblock content %}

{% block extra_js %}
<script>
    (function () {
        var generarUrl = "{% url 'syh:generar_resumen' %}";
        var progresoUrl = "{% url 'syh:progreso_tarea' 'task_id_placeholder' %}";
        var downloadUrl = "{% url 'syh:download_file' 'pdf_file_placeholder' %}";

        var boton = document.getElementById('resumen-button');
        var select = document.getElementById('cliente-select');
        var contenedorProgreso = document.getElementById('task-progress');
        var barra = document.getElementById('progress-bar');
        var estado = document.getElementById('estado-tarea');
        var descarga = document.getElementById('descarga-archivos');
        var enlace = document.getElementById('download-link');

        function alerta(titulo, mensaje, tono) {
            if (window.ANDialog) {
                ANDialog.alert({titulo: titulo, mensaje: mensaje, confirmar: 'Entendido', tono: tono});
            } else {
                window.alert(mensaje);
            }
        }

        function setProgreso(porcentaje) {
            if (porcentaje < 0 || isNaN(porcentaje)) { porcentaje = 0; }
            if (porcentaje > 100) { porcentaje = 100; }
            barra.style.width = porcentaje + '%';
            barra.setAttribute('aria-valuenow', porcentaje);
        }

        function iniciarTarea() {
            var clienteId = select.value;
            if (!clienteId) {
                alerta('Falta elegir la empresa', 'Elegí una empresa para generar el resumen.', 'aviso');
                return;
            }

            boton.disabled = true;
            descarga.style.display = 'none';
            contenedorProgreso.style.display = 'block';
            estado.textContent = 'Iniciando...';
            setProgreso(0);

            $.ajax({
                url: generarUrl + '?cliente=' + encodeURIComponent(clienteId),
                type: 'GET'
            }).done(function (respuesta) {
                consultarEstado(respuesta.task_id);
            }).fail(function (xhr) {
                boton.disabled = false;
                contenedorProgreso.style.display = 'none';
                var mensaje = (xhr.responseJSON && xhr.responseJSON.error) || 'No se pudo iniciar la generación.';
                alerta('Error', mensaje, 'peligro');
            });
        }

        function consultarEstado(taskId) {
            $.ajax({
                url: progresoUrl.replace('task_id_placeholder', taskId),
                type: 'GET'
            }).done(function (respuesta) {
                if (respuesta.state === 'SUCCESS') {
                    setProgreso(100);
                    estado.textContent = 'Listo. Podés descargar el resumen.';
                    var nombre = (respuesta.pdf_file || '').split('/').pop();
                    enlace.href = downloadUrl.replace('pdf_file_placeholder', nombre);
                    enlace.setAttribute('download', nombre);
                    descarga.style.display = 'block';
                    boton.disabled = false;
                    enlace.click();
                } else if (respuesta.state === 'FAILURE') {
                    boton.disabled = false;
                    setProgreso(0);
                    alerta('No se pudo generar el resumen', respuesta.message || 'La tarea falló.', 'peligro');
                } else {
                    var total = respuesta.total || 100;
                    setProgreso(Math.round((respuesta.current / total) * 100));
                    estado.textContent = respuesta.message || 'Procesando...';
                    setTimeout(function () { consultarEstado(taskId); }, 1000);
                }
            }).fail(function () {
                setTimeout(function () { consultarEstado(taskId); }, 2000);
            });
        }

        boton.addEventListener('click', iniciarTarea);
    })();
</script>
{% endblock extra_js %}
